<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenSwap - Дахин боловсруулалт</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body>
  <cmp-header></cmp-header>
  <main id="app-content">
    <div class="loading-screen">
      <div class="loader">♻️</div>
      <p>Ачааллаж байна...</p>
    </div>
  </main>
  <footer-h></footer-h>
  <script type="module" src="components/cmp-header.js"></script>
  <script type="module" src="components/footer-h.js"></script>
  <script type="module" src="components/co-product.js"></script>
  <script type="module" src="components/trash-filter.js"></script>
  <script type="module" src="components/h-cart.js"></script>
  <script type="module" src="app.js"></script>
  <style>
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      padding: 60px 20px;
    }

    .loader {
      font-size: 64px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .loading-screen p {
      margin-top: 20px;
      font-size: 16px;
      color: #666;
    }
  </style>
</body>
</html>
